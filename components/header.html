<header class="top-header">

    <div class="header-left">

        <button
            id="menu-toggle-btn"
            class="menu-btn">

            ☰

        </button>

        <input
            id="global-search"
            name="globalSearch"
            type="search"
            placeholder="Search assets, AI agents, buildings..."
        >

    </div>

    <div class="header-right">

        <button
            id="notification-btn"
            class="icon-btn">

            🔔

        </button>

        <button
            id="help-btn"
            class="icon-btn">

            ❓

        </button>

        <select
            id="building-selector"
            name="building">

            <option>Head Office</option>
            <option>Branch Office</option>

        </select>

        <button
            id="add-module-btn"
            class="add-btn">

            + Add Module

        </button>

    </div>

</header>
