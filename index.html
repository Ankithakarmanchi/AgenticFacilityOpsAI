<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Agentic Facility Operations AI</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="container">

        <!-- ================= Left Panel ================= -->

        <div class="left-panel">

            <h1>FacilityOps AI</h1>

            <h3>Agentic Facility Operations Platform</h3>

            <p>

                Monitor. Predict. Optimize.

                <br><br>

                An intelligent AI platform for managing smart buildings,

                energy consumption,

                predictive maintenance,

                occupancy analytics,

                and operational efficiency.

            </p>

        </div>

        <!-- ================= Right Panel ================= -->

        <div class="right-panel">

            <div class="login-card">

                <h2>Welcome Back</h2>

                <p>Sign in to continue</p>

                <form id="loginForm">

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Username"
                        required
                    >

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Password"
                        required
                    >

                    <div class="options">

                        <label>

                            <input
                                id="rememberMe"
                                name="rememberMe"
                                type="checkbox"
                            >

                            Remember Me

                        </label>

                        <a href="#">Forgot Password?</a>

                    </div>

                    <button type="submit">

                        Secure Login

                    </button>

                </form>

            </div>

        </div>

    </div>

    <script defer src="js/script.js"></script>

</body>

</html>
